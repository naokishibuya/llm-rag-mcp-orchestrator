llm:
  - class: backend.agent.llm.ollama.OllamaChat
    model: qwen2.5:7b
    params:
      temperature: 0.3
  - class: backend.agent.llm.gemini.GeminiChat
    model: gemini-2.5-flash
    api_key_env: GEMINI_API_KEY
    params:
      temperature: 0.3
  - class: backend.agent.llm.anthropic.AnthropicChat
    model: claude-haiku-4-5-20251001
    api_key_env: ANTHROPIC_API_KEY
    params:
      temperature: 0.3
  - class: backend.agent.llm.openai.OpenAIChat
    model: gpt-4.1-nano
    api_key_env: OPENAI_API_KEY
    params:
      temperature: 0.3

workflow:
  max_forwards: 2

agents:
  assistant:
    role: "General chat, greetings, simple questions, time, math"
    system_prompt: |
      You are a helpful, friendly assistant.
      Be concise but informative. If you don't know something, say so rather than making things up.
    tools: [get_current_time, get_user_context, calculate]
  knowledge:
    role: "Questions about space, history, geography — topics in the local knowledge base"
    system_prompt: |
      You are a knowledge base specialist.
      Search the knowledge base to answer questions. Cite sources when available.
      If the knowledge base has no relevant results, say so.
    tools: [search_knowledge_base]
  researcher:
    role: "General research, technical questions, how-to guides, current events, and anything not covered by other agents"
    system_prompt: |
      You are a research specialist.
      Use web search to find accurate, up-to-date information.
      Cite sources with links when available. Be thorough but concise.
    tools: [tavily_search]
  analyst:
    role: "Finance, stocks, market data, and financial calculations"
    system_prompt: |
      You are a financial analyst.
      Present data clearly in tables when appropriate.
      Be precise with numbers and cite data sources.
    tools: [get_stock_price, calculate]
  weather_expert:
    role: "Weather queries, forecasts, conditions"
    system_prompt: |
      You are a weather specialist.
      Provide clear, concise weather information.
      Include relevant details like temperature, conditions, and forecasts.
    tools: [get_weather, get_user_context]

mcp:
  services:
    finance:
      url: http://127.0.0.1:8030/mcp
      format: "Markdown table with bold headers: **Symbol**, **Price**, **Change**, **Market Cap**. Use bold for values too."
    weather:
      url: http://127.0.0.1:8031/mcp
      format: "Bullet list with bold labels: **City**, **Temperature**, **Condition**, **Humidity**."
    tavily:
      url: https://mcp.tavily.com/mcp/?tavilyApiKey=${TAVILY_API_KEY}
      timeout: 30
      format: "Bulleted list of results, each with a markdown link title and a one-line summary."

rag:
  embeddings:
    class: backend.agent.llm.ollama.OllamaEmbeddings
    model: nomic-embed-text
  params:
    top_k: 2
    topics:
      - name: Space
        description: "Solar system, planets, space exploration, astronauts, missions"
        directory: space
      - name: History
        description: "Ancient civilizations, world wars, modern history, key events"
        directory: history
      - name: Geography
        description: "Natural wonders, countries, landmarks, mountains, rivers"
        directory: geography

pricing:
  qwen2.5:7b:
    input: 0.00
    output: 0.00
  gemini-2.5-flash: # may not apply when using free-tier
    input: 0.30  # $ per 1M tokens
    output: 2.50
  claude-haiku-4-5-20251001:
    input: 0.80  # $ per 1M tokens
    output: 4.00
  gpt-4.1-nano:
    input: 0.10  # $ per 1M tokens
    output: 0.40
  nomic-embed-text:
    input: 0.00
    output: 0.00
